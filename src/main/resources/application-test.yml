# 测试环境配置
spring:
  # 测试环境使用 H2 内存数据库
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: false
  
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop

# 测试环境日志级别
logging:
  level:
    root: INFO
    com.freedom.securitysamples: DEBUG
    org.springframework.web: WARN

# 测试环境关闭 Swagger UI
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: true
